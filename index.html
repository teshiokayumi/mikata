<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校務のミカタ | 議事録・TODO自動整形アプリ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <header>
    <div class="logo">
      <div class="logo-icon">
        <i data-lucide="file-text"></i>
      </div>
      <span>校務のミカタ <small style="font-size: 0.6em; opacity: 0.7; font-weight: normal;">議事録DX</small></span>
    </div>
    <div class="header-actions">
      <button class="btn-outline" id="apiKeyBtn">
        <i data-lucide="key"></i> API設定
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Input Panel -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <i data-lucide="message-square"></i> 会議メモ入力
        </div>
        <div class="panel-actions">
          <button class="btn-outline" id="clearBtn" title="リセット">
            <i data-lucide="trash-2"></i>
          </button>
        </div>
      </div>

      <div class="chat-container" id="chatHistory">
        <div class="message ai">
          先生、お疲れ様です！本日の会議・打ち合わせのメモをこちらに入れてください。<br>
          「議題」「発言」「決定事項」など、バラバラでも構いません。最後に「議事録を生成」ボタンを押すと整形されます。
        </div>
      </div>

      <div class="input-footer">
        <div class="input-wrapper">
          <textarea id="userInput" placeholder="例：議題：運動会の日程について
A先生：5月24日はどうか？
決定：5月24日に内定"></textarea>
          <button class="send-btn" id="sendBtn">
            <i data-lucide="send"></i>
          </button>
        </div>
        <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.8rem; color: var(--text-muted);">
            ※ 音声文字起こしの貼り付けも可能です
          </span>
          <button class="btn-primary" id="generateBtn">
            議事録を生成する <i data-lucide="sparkles" style="width: 16px; margin-left:1px;"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Result Panel -->
    <section class="panel" id="resultPanel">
      <div class="panel-header">
        <div class="panel-title">
          <i data-lucide="layout"></i> 生成された議事録案
        </div>
        <div class="action-bar">
          <button class="btn-outline" id="copyBtn">
            <i data-lucide="copy"></i> 全部コピー
          </button>
        </div>
      </div>

      <div class="result-container" id="resultArea">
        <div style="color: var(--text-muted); text-align: center; margin-top: 4rem;">
          <i data-lucide="arrow-left" style="width: 48px; height: 48px; opacity: 0.2;"></i>
          <p style="margin-top: 1rem;">左側でメモを入力して「生成」ボタンを押してください</p>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loader">
          <div class="spinner"></div>
          <p style="font-weight: 600; color: var(--primary-dark);">AIが教案・議事録を整理中...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- API Key Modal -->
  <div id="apiModal" class="hidden"
    style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);">
    <div
      style="background: white; padding: 2rem; border-radius: var(--radius-lg); width: 90%; max-width: 400px; box-shadow: var(--shadow-premium);">
      <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
        <i data-lucide="settings"></i> Gemini API設定
      </h3>
      <p style="font-size: 0.9rem; margin-bottom: 1.5rem; color: var(--text-muted);">
        Google AI Studioで作成したAPIキーを入力してください。キーはブラウザのローカルストレージに保存されます。
      </p>
      <div style="margin-bottom: 1rem;">
        <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-main);">使用するAIモデル</label>
        <select id="modelSelect"
          style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 0.4rem; background: white;">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash (推奨:高速)</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash (安定版)</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro (高精度・重い)</option>
          <option value="custom">その他 (手入力)</option>
        </select>
        <input type="text" id="customModelInput" placeholder="モデル名を入力 (例: gemini-3.0-pro)" class="hidden"
          style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 0.5rem;">
      </div>
      <div style="margin-bottom: 1.5rem;">
        <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-main);">APIキー</label>
        <input type="password" id="apiKeyInput" placeholder="AIza..."
          style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 0.4rem;">
      </div>
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button class="btn-outline" id="closeModal">キャンセル</button>
        <button class="btn-primary" id="saveKeyBtn">保存する</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Lucideアイコンの初期化（最新の書き方）
    lucide.createIcons();
  </script>
</body>

</html>
